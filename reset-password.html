<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Salon Assist CX</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://pwytzdclfiuepbcceoqd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3eXR6ZGNsZml1ZXBiY2Nlb3FkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MTUzMzAsImV4cCI6MjA4NzI5MTMzMH0.lemmT3-2ooVyQN9X-wVnssqJ1epZ4DCoLEMy23gfYSE';
  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      detectSessionInUrl: true,
      persistSession: true
    }
  });
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #16100c; --rust: #b8522e; --rust-light: #d4724f;
  --rust-pale: #f8ede7; --cream: #faf5ee; --sand: #e8d4bc;
  --border: #e0ccb4; --text-muted: #8a6a56;
}
body { font-family: 'DM Sans', sans-serif; background: var(--cream); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { background: #fff; border: 1px solid var(--border); border-radius: 24px; padding: 48px 44px; width: 100%; max-width: 420px; box-shadow: 0 8px 40px rgba(22,16,12,0.08); }
.brand { display: flex; align-items: center; gap: 10px; font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; color: var(--ink); margin-bottom: 32px; }
.brand-icon { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--rust) 0%, #7a2e10 100%); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.brand em { color: var(--rust); font-style: italic; }
h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 300; color: var(--ink); margin-bottom: 6px; }
.subtitle { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 28px; font-weight: 300; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--ink); background: var(--cream); outline: none; transition: border-color 0.15s; }
input:focus { border-color: var(--rust); background: #fff; }
.btn-submit { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--rust) 0%, #942a0e 100%); color: #fff; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 0.92rem; font-weight: 500; cursor: pointer; margin-top: 8px; transition: all 0.18s; box-shadow: 0 2px 12px rgba(184,82,46,0.3); }
.btn-submit:hover { filter: brightness(1.08); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.msg { padding: 10px 14px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 16px; display: none; }
.msg.error { background: #fdecea; border: 1px solid #f5c6c6; color: #c0392b; }
.msg.success { background: #e8f0e9; border: 1px solid #b5d4b8; color: #2d6a35; }
.req { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; font-weight: 300; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--sand); border-top-color: var(--rust); animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon">✂️</div>
    Salon Assist <em>CX</em>
  </div>

  <!-- LOADING -->
  <div id="loadingState">
    <div class="spinner"></div>
    <h2>Verifying…</h2>
    <p class="subtitle">Checking your reset link.</p>
  </div>

  <!-- RESET FORM -->
  <div id="resetForm" style="display:none;">
    <h2>Set new password</h2>
    <p class="subtitle">Choose a strong password for your account.</p>
    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="••••••••" oninput="checkStrength()">
      <div class="req" id="passwordReq">Must be at least 8 characters</div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="••••••••">
    </div>
    <button class="btn-submit" id="submitBtn" onclick="updatePassword()">Update Password →</button>
  </div>

  <!-- INVALID / EXPIRED -->
  <div id="invalidState" style="display:none;">
    <h2>Link expired</h2>
    <p class="subtitle" style="margin-bottom:20px;">This reset link has expired or already been used. Request a new one from the login page.</p>
    <button class="btn-submit" onclick="window.location.href='login.html'">Back to Login →</button>
  </div>
</div>

<script>
function show(id) {
  ['loadingState','resetForm','invalidState'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}

async function init() {
  // Parse the hash parameters
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const accessToken = params.get('access_token');
  const refreshToken = params.get('refresh_token');
  const type = params.get('type');

  console.log('type:', type, 'has token:', !!accessToken);

  if (!accessToken || type !== 'recovery') {
    // No token in URL — check if already have a recovery session
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      show('resetForm');
    } else {
      show('invalidState');
    }
    return;
  }

  // Set the session from the token
  try {
    const { data, error } = await supabaseClient.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken || ''
    });

    if (error) {
      console.error('setSession error:', error);
      show('invalidState');
      return;
    }

    show('resetForm');
  } catch(e) {
    console.error('init error:', e);
    show('invalidState');
  }
}

// Run on load
window.addEventListener('load', init);

function checkStrength() {
  const val = document.getElementById('newPassword').value;
  const req = document.getElementById('passwordReq');
  if (val.length >= 8) { req.style.color = '#2d6a35'; req.textContent = '✓ Looks good'; }
  else { req.style.color = 'var(--text-muted)'; req.textContent = 'Must be at least 8 characters'; }
}

async function updatePassword() {
  const newPw = document.getElementById('newPassword').value;
  const confirmPw = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('submitBtn');
  const errorEl = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');

  errorEl.style.display = 'none';
  successEl.style.display = 'none';

  if (newPw.length < 8) { errorEl.textContent = 'Password must be at least 8 characters.'; errorEl.style.display = 'block'; return; }
  if (newPw !== confirmPw) { errorEl.textContent = 'Passwords do not match.'; errorEl.style.display = 'block'; return; }

  btn.disabled = true;
  btn.textContent = 'Updating…';

  const { error } = await supabaseClient.auth.updateUser({ password: newPw });

  if (error) {
    errorEl.textContent = '⚠️ ' + error.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Update Password →';
    return;
  }

  successEl.textContent = '✅ Password updated! Redirecting to your dashboard…';
  successEl.style.display = 'block';
  setTimeout(() => window.location.href = 'dashboard.html', 2000);
}
</script>
</body>
</html>
