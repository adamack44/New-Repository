<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salon Assist CX</title>
<script>
  const path = window.location.pathname.replace(/^\//, '').trim();

  // Known HTML pages — serve directly
  const knownPages = ['about.html','contact.html','login.html','dashboard.html','booking.html','upgrade.html','appointments.html','reset-password.html','admin.html'];
  if (knownPages.includes(path)) {
    window.location.replace('/' + path);
  }
  // System paths — go home
  else if (!path || path.includes('.') || path.startsWith('api/') || ['login','dashboard','upgrade','appointments','reset-password','sacx-admin','admin','booking','about','contact'].includes(path)) {
    window.location.replace('/');
  }
  // Stylist slug — load booking page keeping clean URL
  else {
    fetch('/booking.html?stylist=' + encodeURIComponent(path))
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
        window.history.replaceState(null, '', '/' + path);
      })
      .catch(() => window.location.replace('/'));
  }
</script>
</head>
<body></body>
</html>
